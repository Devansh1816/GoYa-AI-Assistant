<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoYa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(4, 11, 29, 1) 0%, rgba(13, 20, 42, 1) 90%);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Sci-Fi Decorative Grid Background Overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(18, 24, 48, 0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(18, 24, 48, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: 0;
        }

        .dashboard {
            width: 95vw;
            max-width: 1280px;
            height: 85vh;
            max-height: 760px;
            background: rgba(13, 20, 38, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            z-index: 1;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            overflow: hidden;
        }

        /* ================= HEADER / TOP NAV ================= */
        .header {
            grid-column: 1 / span 3;
            height: 70px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(8, 14, 28, 0.4);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ai-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #0284c7, #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(168, 85, 247, 0.3); }
            100% { box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background-color: rgba(5, 150, 105, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            font-size: 0.75rem;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge::before {
            content: "";
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 8px #34d399;
        }

        /* ================= SIDEBAR LEFT ================= */
        .sidebar-left {
            border-right: 1px solid rgba(56, 189, 248, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
            background: rgba(8, 14, 28, 0.2);
        }

        .panel-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #94a3b8;
            margin-bottom: 0.8rem;
            font-weight: 600;
        }

        /* Telecom / Stats Row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 12px 6px;
            text-align: center;
            transition: all 0.3s;
        }

        .stat-card:hover {
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(15, 23, 42, 0.6);
        }

        .stat-icon { font-size: 1.25rem; margin-bottom: 6px; display: block; }
        .stat-label { font-size: 0.65rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .stat-val { font-size: 0.9rem; font-weight: 700; color: #e2e8f0; margin-top: 2px; font-family: 'Space Grotesk', sans-serif; }

        /* Quick Launch Widget */
        .automation-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px 16px;
            width: 100%;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
            text-align: left;
        }

        .app-btn:hover {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, rgba(168, 85, 247, 0.05) 100%);
            border-color: rgba(56, 189, 248, 0.4);
            color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        .app-icon-bg {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.03);
            font-size: 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ================= MAIN INTERFACE (CENTER) ================= */
        .main-stage {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2.5rem 1.5rem;
            position: relative;
        }

        /* Voice Visualizer Orb */
        .visualizer-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .orbit-container {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        /* Rotating Background Energy Rings */
        .energy-ring-inner, .energy-ring-outer {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid transparent;
            pointer-events: none;
        }

        .energy-ring-outer {
            width: 255px;
            height: 255px;
            border-top-color: rgba(168, 85, 247, 0.45);
            border-bottom-color: rgba(56, 189, 248, 0.45);
            animation: spin-clockwise 10s linear infinite;
        }

        .energy-ring-inner {
            width: 220px;
            height: 220px;
            border-left-color: rgba(6, 182, 212, 0.4);
            border-right-color: rgba(236, 72, 153, 0.3);
            animation: spin-counter 7s linear infinite;
        }

        @keyframes spin-clockwise { 100% { transform: rotate(360deg); } }
        @keyframes spin-counter { 100% { transform: rotate(-360deg); } }

        /* The Animated Microphone Orb */
        .mic-btn-premium {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(14, 28, 62, 0.9) 0%, rgba(8, 14, 30, 1) 100%);
            border: 2px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            font-size: 3.5rem;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-btn-premium:hover {
            border-color: #38bdf8;
            color: #38bdf8;
            transform: scale(1.04);
            box-shadow: 0 0 45px rgba(56, 189, 248, 0.3);
        }

        /* Active listening pulse effects */
        .mic-btn-premium.listening {
            border-color: #ec4899;
            color: #ec4899;
            animation: active-pulse 1.8s infinite;
        }

        @keyframes active-pulse {
            0% { transform: scale(1); box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 40px rgba(236, 72, 153, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 25px rgba(236, 72, 153, 0.4); }
        }

        .listening .energy-ring-outer { border-top-color: #ec4899; border-bottom-color: #a855f7; }

        .wake-status {
            font-size: 1.05rem;
            color: #38bdf8;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.5px;
            min-height: 25px;
        }

        /* Premium Floating Input Bar */
        .cmd-bar-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            gap: 12px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px;
            border-radius: 18px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            transition: all 0.3s;
        }

        .cmd-bar-wrapper:focus-within {
            border-color: rgba(56, 189, 248, 0.45);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.15), inset 0 2px 4px rgba(0,0,0,0.4);
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: none;
            background-color: transparent;
            color: white;
            font-size: 1rem;
            outline: none;
            font-family: inherit;
        }

        input[type="text"]::placeholder {
            color: #64748b;
        }

        button.run-btn-goya {
            padding: 0 1.8rem;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: all 0.2s;
        }

        button.run-btn-goya:hover {
            opacity: 0.95;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }

        /* ================= SIDEBAR RIGHT ================= */
        .sidebar-right {
            border-left: 1px solid rgba(56, 189, 248, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            background: rgba(8, 14, 28, 0.2);
        }

        .response-timeline {
            flex: 1;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(85vh - 120px);
        }

        .msg-bubble {
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 0.92rem;
            line-height: 1.45;
        }

        .msg-goya {
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.1) 0%, rgba(168, 85, 247, 0.05) 100%);
            border: 1px solid rgba(56, 189, 248, 0.15);
            color: #e2e8f0;
        }

        .msg-user {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            align-self: flex-end;
            text-align: right;
            width: fit-content;
            max-width: 85%;
        }

        /* Scrollbar styles */
        .response-timeline::-webkit-scrollbar {
            width: 5px;
        }
        .response-timeline::-webkit-scrollbar-track {
            background: transparent;
        }
        .response-timeline::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- 1. Header Top Area -->
        <header class="header">
            <div class="brand">
                <div class="ai-logo">Y</div>
                <h1 class="brand-name">GoYa</h1>
            </div>
            <div class="badge" id="goyaStatus">SYSTEM ONLINE (Port 5000)</div>
        </header>

        <!-- 2. Sidebar Left: System Dashboard & Automations -->
        <aside class="sidebar-left">
            <div>
                <h2 class="panel-title">System Status</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-icon">💻</span>
                        <div class="stat-label">CPU</div>
                        <div id="cpuVal" class="stat-val">--%</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">💾</span>
                        <div class="stat-label">RAM</div>
                        <div id="ramVal" class="stat-val">--%</div>
                    </div>
                    <div class="stat-card">
                        <span class="stat-icon">📂</span>
                        <div class="stat-label">Disk</div>
                        <div id="diskVal" class="stat-val">--%</div>
                    </div>
                </div>
            </div>

            <div>
                <h2 class="panel-title">Quick Launches</h2>
                <div class="automation-box">
                    <button class="app-btn" onclick="sendQuickLaunch('open chrome')">
                        <span class="app-icon-bg">🌐</span> Launch Chrome
                    </button>
                    <button class="app-btn" onclick="sendQuickLaunch('youtube search')">
                        <span class="app-icon-bg">🎥</span> Search YouTube
                    </button>
                    <button class="app-btn" onclick="sendQuickLaunch('open notepad')">
                        <span class="app-icon-bg">📝</span> Open Notepad
                    </button>
                    <button class="app-btn" onclick="sendQuickLaunch('screenshot')">
                        <span class="app-icon-bg">📸</span> Capture Screenshot
                    </button>
                </div>
            </div>
        </aside>

        <!-- 3. Central Stage: The Voice Orb & Interactive Visualizers -->
        <main class="main-stage">
            <div class="visualizer-wrapper">
                <div class="orbit-container">
                    <div class="energy-ring-outer"></div>
                    <div class="energy-ring-inner"></div>
                    <button class="mic-btn-premium" id="micBtn" onclick="toggleListening()">🎙️</button>
                </div>
                <div class="wake-status" id="wakeStatus">👂 Listening for "Hey GoYa"...</div>
            </div>

            <div class="cmd-bar-wrapper">
                <input type="text" id="cmdInput" placeholder="Say 'Hey GoYa...' or type command" onkeypress="handleKeyPress(event)">
                <button class="run-btn-goya" onclick="sendCommand()">Run</button>
            </div>
        </main>

        <!-- 4. Sidebar Right: Conversation Flow -->
        <aside class="sidebar-right">
            <h2 class="panel-title">Response Hub</h2>
            <div class="response-timeline" id="responseBox">
                <div class="msg-bubble msg-goya">
                    🤖 <strong>GoYa:</strong> Online and active! Say "Hey GoYa" out loud or click the center orb to speak.
                </div>
            </div>
        </aside>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const cmdInput = document.getElementById('cmdInput');
        const responseBox = document.getElementById('responseBox');
        const wakeStatus = document.getElementById('wakeStatus');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let activeRec = null;

        // Fetch Computer Telemetry Regularly
        async function fetchTelemetry() {
            try {
                const res = await fetch('http://127.0.0.1:5000/api/telemetry');
                const data = await res.json();
                document.getElementById('cpuVal').innerText = `${data.cpu}%`;
                document.getElementById('ramVal').innerText = `${data.ram}%`;
                document.getElementById('diskVal').innerText = `${data.disk}%`;
            } catch (err) {
                console.warn("Could not retrieve system telemetry.");
            }
        }
        setInterval(fetchTelemetry, 3500);
        window.addEventListener('load', fetchTelemetry);

        function toggleListening() {
            if (!SpeechRecognition) {
                alert("This browser does not support Speech recognition.");
                return;
            }

            if (activeRec) {
                activeRec.stop();
                activeRec = null;
                micBtn.classList.remove('listening');
                wakeStatus.innerText = '👂 Listening for "Hey GoYa"...';
                return;
            }

            activeRec = new SpeechRecognition();
            activeRec.lang = 'en-US';
            activeRec.interimResults = false;

            micBtn.classList.add('listening');
            wakeStatus.innerText = "🎙️ Sound Orbit active... Speak now!";

            activeRec.onresult = (e) => {
                const text = e.results[0][0].transcript;
                cmdInput.value = text;
                wakeStatus.innerText = `Matched: "${text}"`;
                sendCommand(text);
                micBtn.classList.remove('listening');
                activeRec = null;
            };

            activeRec.onerror = (err) => {
                console.error(err);
                micBtn.classList.remove('listening');
                wakeStatus.innerText = '👂 Listening for "Hey GoYa"...';
                activeRec = null;
            };

            activeRec.onend = () => {
                micBtn.classList.remove('listening');
                activeRec = null;
            };

            try {
                activeRec.start();
            } catch(ex) {
                micBtn.classList.remove('listening');
                activeRec = null;
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendCommand();
        }

        function sendQuickLaunch(cmd) {
            cmdInput.value = cmd;
            sendCommand(cmd);
        }

        async function sendCommand(customCmd = null) {
            const commandText = customCmd || cmdInput.value.trim();
            if (!commandText) return;

            // Add user bubble to Hub
            if(!customCmd) {
                const userBubble = document.createElement('div');
                userBubble.className = "msg-bubble msg-user";
                userBubble.innerHTML = commandText;
                responseBox.appendChild(userBubble);
                responseBox.scrollTop = responseBox.scrollHeight;
            }

            const goyaStatusBubble = document.createElement('div');
            goyaStatusBubble.className = "msg-bubble msg-goya";
            goyaStatusBubble.innerHTML = "⏳ Computing Command...";
            responseBox.appendChild(goyaStatusBubble);
            responseBox.scrollTop = responseBox.scrollHeight;

            cmdInput.value = "";

            try {
                const res = await fetch('http://127.0.0.1:5000/api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: commandText })
                });
                const data = await res.json();
                
                if (data.status === 'success') {
                    goyaStatusBubble.innerHTML = `🤖 <strong>GoYa:</strong> ${data.message}`;
                    speakResponse(data.message);
                } else {
                    goyaStatusBubble.innerHTML = `❌ <strong>Error:</strong> ${data.message}`;
                }
            } catch (err) {
                goyaStatusBubble.innerHTML = "❌ Connection failed to Python backend on http://127.0.0.1:5000.";
            }
            responseBox.scrollTop = responseBox.scrollHeight;
        }

        function speakResponse(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
